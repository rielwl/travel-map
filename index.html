<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Places I've been</title>
<meta name="description" content="A personal world map of places lived in, visited and passed through.">
<meta name="color-scheme" content="dark light">

<!-- The ◍ mark from the empty state, in --accent. Inline so the page makes no
     extra request and a standalone tab is not left with a 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e0a13c' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23e0a13c'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<script>
/* Set the theme before first paint so the page never flashes the wrong ground.
   Order: ?theme= wins, then a saved toggle, then the OS setting. Notion iframes
   do not inherit Notion's own theme, so dark is the fallback — it is tuned to
   sit inside a Notion dark page. */
(function () {
  var forced = new URLSearchParams(location.search).get("theme");
  var saved = null;
  try { saved = localStorage.getItem("pm-theme"); } catch (e) { /* blocked in some iframes */ }
  var t = forced || saved;
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
</head>
<body>

<main class="pm-app" id="app">

  <header class="pm-hd">
    <div>
      <h1 class="pm-title">Places I've been</h1>
      <p class="pm-sub" data-sub>A slow record of where I've lived, stayed and passed through.</p>
    </div>
    <div class="pm-hdactions">
      <button class="pm-btn pm-btn-icon" type="button" data-act="theme"
              aria-label="Switch to light theme" title="Switch theme">☾</button>
      <button class="pm-btn" type="button" data-act="add">＋ Add a place</button>
    </div>
  </header>

  <div class="pm-stats" data-stats>
    <div class="pm-stat"><span class="pm-statv" data-stat="countries">—</span><span class="pm-statl">countries</span></div>
    <div class="pm-stat"><span class="pm-statv" data-stat="cities">—</span><span class="pm-statl">cities</span></div>
    <div class="pm-stat"><span class="pm-statv" data-stat="pct">—</span><span class="pm-statl">of the world</span></div>
    <div class="pm-stat"><span class="pm-statv" data-stat="years">—</span><span class="pm-statl">years travelling</span></div>
  </div>

  <div class="pm-bar">
    <div class="pm-seg" role="group" aria-label="Filter by type">
      <button class="pm-segb is-on" type="button" data-type="all" aria-pressed="true">All</button>
      <button class="pm-segb" type="button" data-type="lived" aria-pressed="false">Lived</button>
      <button class="pm-segb" type="button" data-type="visited" aria-pressed="false">Visited</button>
      <button class="pm-segb" type="button" data-type="passed" aria-pressed="false">Passed</button>
    </div>
    <label class="pm-select"><span>Year</span>
      <select data-year><option value="all">All years</option></select>
    </label>
  </div>

  <div class="pm-main">
    <div class="pm-mapcol">
      <div class="pm-mapwrap" data-mapwrap>
        <!-- js/map.js renders the SVG here. -->
        <div class="pm-tip" data-tip hidden></div>
        <div class="pm-maptools">
          <button class="pm-zoomb" type="button" data-zoom="in" aria-label="Zoom in">+</button>
          <button class="pm-zoomb" type="button" data-zoom="out" aria-label="Zoom out">−</button>
          <button class="pm-zoomb" type="button" data-zoom="reset" aria-label="Reset the map view">⊚</button>
        </div>
      </div>
      <div class="pm-legend">
        <span class="pm-leg"><i class="pm-sw pm-sw-visited"></i>visited country</span>
        <span class="pm-leg"><i class="pm-sw pm-sw-base"></i>not yet</span>
        <span class="pm-leg"><i class="pm-dot pm-dot-lived"></i>lived</span>
        <span class="pm-leg"><i class="pm-dot pm-dot-visited"></i>visited</span>
        <span class="pm-leg"><i class="pm-dot pm-dot-passed"></i>passed through</span>
      </div>
    </div>

    <aside class="pm-side">
      <div data-card></div>
      <div data-draft></div>
      <div class="pm-listhd">
        <span data-listcount>—</span>
        <span class="pm-sortby">by year ↓</span>
      </div>
      <div class="pm-list" data-list></div>
    </aside>
  </div>

  <!-- Text equivalent of the map, for screen readers and for anyone who cannot
       use the pins. Kept in sync with the current filter. -->
  <div class="pm-sr" data-summary aria-live="polite"></div>

</main>

<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"
        integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"
        integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67"
        crossorigin="anonymous"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>

</body>
</html>
